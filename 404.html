<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Film Matrix — Page Not Found</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05060c">
<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#05060c;
      --bg1:#070a14;
      --bg2:#071425;

      --accent:#22d3ee;
      --accentSoft:rgba(34,211,238,.18);
      --accentBorder:rgba(34,211,238,.55);

      --muted:rgba(231,236,255,.65);
      --card:rgba(10,14,28,.78);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      font-family:Inter,system-ui,sans-serif;
      color:#e7ecff;
      overflow:hidden;

      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(124,58,237,.18), transparent 55%),
        radial-gradient(900px 520px at 85% 20%, rgba(34,211,238,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0), var(--bg2));
    }

    /* MATRIX CANVAS */
    #matrixRain{
      position:fixed;
      inset:0;
      width:100vw;
      height:100svh;
      z-index:0;
      pointer-events:none;
    }

    .card{
      position:relative;
      z-index:1;

      max-width:520px;
      padding:34px 28px;
      border-radius:26px;

      border:1px solid var(--accentBorder);
      background:var(--card);

      box-shadow:
        0 0 0 1px var(--accentSoft),
        0 28px 90px rgba(0,0,0,.7);

      text-align:center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo{
      font-family:Orbitron,system-ui,sans-serif;
      font-weight:800;
      letter-spacing:.18em;
      margin-bottom:18px;
      color:var(--accent);
    }

    h1{
      font-family:Orbitron,system-ui,sans-serif;
      font-size:32px;
      letter-spacing:.08em;
      margin:0 0 10px;
    }

    p{
      color:var(--muted);
      line-height:1.6;
      margin:0 0 26px;
    }

    .actions{
      display:flex;
      justify-content:center;
    }

    .btn{
      min-width:260px; /* 🔑 longer button */
      padding:16px 18px;
      border-radius:999px;

      border:1px solid var(--accentBorder);
      background:rgba(6,10,18,.6);

      color:#e7ecff;
      text-decoration:none;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;

      transition:.2s ease;
    }

    .btn:hover{
      border-color:var(--accent);
      box-shadow:
        0 0 0 1px var(--accentSoft),
        0 0 24px rgba(34,211,238,.35);
    }

    .foot{
      margin-top:22px;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.12em;
    }

    @media (max-width:520px){
      h1{ font-size:26px; }
      .card{ padding:28px 22px; }
      .btn{ min-width:100%; }
    }
  </style>
</head>

<body>

<canvas id="matrixRain"></canvas>

<div class="card">
  <div class="logo">FILM MATRIX</div>

  <h1>404 — Page Not Found</h1>

  <p>
    This route doesn’t exist, was moved,<br>
    or fell through the Matrix.
  </p>

  <div class="actions">
    <a href="https://filmmatrix.net" class="btn">Back to Main Site</a>
  </div>

  <div class="foot">Cyberpunk Interface • Analytics Aware</div>
</div>

<script>
/* ===============================
   MATRIX RAIN — CRISP VERSION
   =============================== */
const canvas = document.getElementById("matrixRain");
const ctx = canvas.getContext("2d");

function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);

const chars = "アカサタナハマヤラ0123456789";
const fontSize = 14;
let cols = Math.floor(window.innerWidth / fontSize);
let drops = Array(cols).fill(1);

// 🔑 sharpen text rendering
ctx.translate(0.5, 0.5);

function draw(){
  /* Faster fade = less blur */
  ctx.fillStyle = "rgba(5,6,12,0.18)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = "600 " + fontSize + "px monospace";
  ctx.fillStyle = "rgba(34,211,238,.75)";

  for(let i = 0; i < drops.length; i++){
    const char = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(char, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > window.innerHeight && Math.random() > 0.97) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(draw, 50);
</script>

</body>
</html>
