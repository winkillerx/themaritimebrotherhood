<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Film Matrix — Page Not Found</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05060c">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#05060c;
      --bg1:#070a14;
      --bg2:#071425;
      --accent:#22d3ee;
      --muted:rgba(231,236,255,.65);
      --card:rgba(10,14,28,.72);
      --border:rgba(120,170,255,.28);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      font-family:Inter,system-ui,sans-serif;
      color:#e7ecff;

      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(124,58,237,.18), transparent 55%),
        radial-gradient(900px 520px at 85% 20%, rgba(34,211,238,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0), var(--bg2));
    }

    .card{
      max-width:520px;
      padding:34px 28px;
      border-radius:24px;
      border:1px solid var(--border);
      background:var(--card);
      box-shadow:0 24px 80px rgba(0,0,0,.65);
      text-align:center;
    }

    .logo{
      font-family:Orbitron,system-ui,sans-serif;
      font-weight:800;
      letter-spacing:.18em;
      margin-bottom:18px;
      color:var(--accent);
    }

    h1{
      font-family:Orbitron,system-ui,sans-serif;
      font-size:32px;
      letter-spacing:.08em;
      margin:0 0 10px;
    }

    p{
      color:var(--muted);
      line-height:1.6;
      margin:0 0 26px;
    }

    .actions{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      padding:16px 18px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(6,10,18,.6);
      color:#e7ecff;
      text-decoration:none;
      font-weight:700;
      letter-spacing:.04em;
      transition:.2s ease;
    }

    .btn:hover{
      border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(34,211,238,.25);
    }

    .foot{
      margin-top:22px;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.08em;
    }

    @media (max-width:520px){
      h1{ font-size:26px; }
      .card{ padding:28px 22px; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">FILM MATRIX</div>

    <h1>Page Not Found</h1>

    <p>
      The page you’re looking for doesn’t exist,<br>
      moved, or hit a broken route.
    </p>

    <div class="actions">
      <a href="https://filmmatrix.net" class="btn">Main Site</a>
    </div>

  </div>

</body>
</html>
