<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film Matrix — Defense Simulation</title>

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ===============================
   GLOBAL HARDENING
================================ */
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  user-select:none;
}
html,body{
  margin:0;
  height:100svh;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
  color:#e7ecff;
  -webkit-tap-highlight-color:transparent;
}

/* ===============================
   THEME
================================ */
:root{
  --bg0:#05060c;
  --bg1:#070a14;
  --bg2:#071425;
  --accent:#22d3ee;
  --accentBorder:rgba(34,211,238,.55);
  --accentSoft:rgba(34,211,238,.18);
  --muted:rgba(231,236,255,.65);
  --card:rgba(10,14,28,.78);
}

/* ===============================
   LAYOUT
================================ */
body{
  display:grid;
  place-items:center;
  background:
    radial-gradient(1200px 600px at 15% 10%, rgba(124,58,237,.18), transparent 55%),
    radial-gradient(900px 520px at 85% 20%, rgba(34,211,238,.18), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg0), var(--bg2));
}

/* MATRIX */
#matrixRain{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}

/* CARD */
.card{
  position:relative;
  z-index:1;
  width:min(760px,96vw);
  max-height:calc(100svh - 8px);
  padding:26px 22px 20px;
  border-radius:26px;
  border:1px solid var(--accentBorder);
  background:var(--card);
  box-shadow:
    0 0 0 1px var(--accentSoft),
    0 24px 70px rgba(0,0,0,.7);
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  text-align:center;
}

.logo{
  font-family:Orbitron;
  color:var(--accent);
  letter-spacing:.18em;
}

h1{
  font-family:Orbitron;
  font-size:26px;
  margin:6px 0;
}

.muted{ color:var(--muted); font-size:14px; }

/* ===============================
   GAME AREA
================================ */
.gameWrap{
  margin:14px 0 12px;
  border-radius:16px;
  border:1px solid var(--accentBorder);
  overflow:hidden;
  background:#02030a;
  flex:1.4;                 /* 🔑 LONGER GAME */
  display:flex;
  flex-direction:column;
}

#game{
  width:100%;
  flex:1;
  min-height:460px;
  touch-action:none;
}

/* HUD */
.hud{
  display:flex;
  justify-content:space-between;
  padding:6px 12px;
  font-family:Orbitron;
  font-size:12px;
  letter-spacing:.1em;
  background:rgba(6,10,18,.9);
  border-top:1px solid var(--accentBorder);
}

/* CONTROLS */
.controls{
  display:flex;
  gap:12px;
  padding:12px;
}

.joystick,.fire{
  flex:1;
  min-height:72px;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--accentBorder);
  background:rgba(6,10,18,.88);
  font-family:Orbitron;
  font-size:13px;
  letter-spacing:.14em;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.fire{
  background:rgba(34,211,238,.18);
  box-shadow:inset 0 0 18px rgba(34,211,238,.25);
}

/* ACTIONS */
.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.btn{
  flex:1;
  padding:14px;
  border-radius:999px;
  border:1px solid var(--accentBorder);
  background:rgba(6,10,18,.7);
  color:#e7ecff;
  font-family:Orbitron;
  letter-spacing:.12em;
  text-transform:uppercase;
}
</style>
</head>

<body>

<canvas id="matrixRain"></canvas>

<div class="card">
  <div class="logo">FILM MATRIX</div>
  <h1>Defense Simulation</h1>
  <div class="muted">Countermeasures engaged</div>

  <div class="gameWrap">
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="score">SCORE 00000</div>
      <div id="lives">LIVES 5</div>
      <div id="high">BEST 00000</div>
    </div>
  </div>

  <div class="controls">
    <div class="joystick" id="joy">MOVE</div>
    <div class="fire" id="fire">FIRE</div>
  </div>

  <div class="actions">
    <button class="btn" id="reset">RESET</button>
    <a class="btn" href="https://filmmatrix.net">EXIT</a>
  </div>
</div>

<script>
/* ===============================
   MATRIX RAIN
================================ */
const mc=document.getElementById("matrixRain");
const mctx=mc.getContext("2d");
function resizeMatrix(){
  mc.width=innerWidth;
  mc.height=innerHeight;
}
resizeMatrix(); addEventListener("resize",resizeMatrix);

const chars="アカサタナハマヤラ0123456789";
const fontSize=14;
let cols=Math.floor(innerWidth/fontSize);
let drops=Array(cols).fill(1);
setInterval(()=>{
  mctx.fillStyle="rgba(5,6,12,.18)";
  mctx.fillRect(0,0,mc.width,mc.height);
  mctx.font="600 "+fontSize+"px monospace";
  mctx.fillStyle="rgba(34,211,238,.75)";
  for(let i=0;i<drops.length;i++){
    mctx.fillText(chars[Math.random()*chars.length|0],i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>innerHeight&&Math.random()>0.97) drops[i]=0;
    drops[i]++;
  }
},50);

/* ===============================
   GAME LOGIC
================================ */
const g=document.getElementById("game");
const ctx=g.getContext("2d");
let w,h;
function resizeGame(){ w=g.width=g.clientWidth; h=g.height=g.clientHeight; }
resizeGame(); addEventListener("resize",resizeGame);

const ship={ x:w/2, targetX:w/2, y:h-26, w:50, h:10 };
let bullets=[], enemies=[];
let score=0, lives=5;
let high=Number(localStorage.getItem("fmHighScore")||0);

const posters=[
  "https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg",
  "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
  "https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg"
];

function spawn(){
  const img=new Image();
  img.src=posters[Math.random()*posters.length|0];
  enemies.push({ x:Math.random()*(w-70), y:-100, w:70, h:105, img });
}

function shoot(){ bullets.push({ x:ship.x, y:ship.y }); }

/* JOYSTICK */
const joy=document.getElementById("joy");
let joyX=0, joyActive=false;

joy.addEventListener("touchstart",e=>{
  e.preventDefault(); e.stopPropagation();
  joyActive=true;
  joyX=e.touches[0].clientX;
},{passive:false});

joy.addEventListener("touchmove",e=>{
  if(!joyActive) return;
  e.preventDefault(); e.stopPropagation();
  const dx=e.touches[0].clientX-joyX;
  ship.targetX+=dx*0.6;
  joyX=e.touches[0].clientX;
},{passive:false});

joy.addEventListener("touchend",e=>{
  e.preventDefault();
  joyActive=false;
},{passive:false});

/* FIRE */
const fire=document.getElementById("fire");
fire.addEventListener("touchstart",e=>{
  e.preventDefault(); e.stopPropagation();
  shoot();
},{passive:false});

/* RESET */
document.getElementById("reset").onclick=()=>{
  bullets=[]; enemies=[];
  score=0; lives=5;
};

/* LOOP */
function loop(){
  ctx.clearRect(0,0,w,h);

  ship.x+=(ship.targetX-ship.x)*0.15;
  ship.x=Math.max(0,Math.min(w,ship.x));

  ctx.fillStyle="#22d3ee";
  ctx.fillRect(ship.x-ship.w/2,ship.y,ship.w,ship.h);

  bullets.forEach(b=>b.y-=12);
  ctx.fillStyle="#7dd3fc";
  bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,8));

  enemies.forEach((e,i)=>{
    e.y+=1.6;
    ctx.drawImage(e.img,e.x,e.y,e.w,e.h);
    bullets.forEach((b,j)=>{
      if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score+=10;
      }
    });
    if(e.y>h){ enemies.splice(i,1); lives--; }
  });

  if(score>high){
    high=score;
    localStorage.setItem("fmHighScore",high);
  }

  document.getElementById("score").textContent=`SCORE ${String(score).padStart(5,"0")}`;
  document.getElementById("lives").textContent=`LIVES ${lives}`;
  document.getElementById("high").textContent=`BEST ${String(high).padStart(5,"0")}`;

  if(lives>0){
    if(Math.random()<0.03) spawn();
    requestAnimationFrame(loop);
  }
}
loop();
</script>

</body>
</html>
