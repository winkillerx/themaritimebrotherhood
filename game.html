<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film Matrix — Defense Simulation</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ===============================
   HARDENING
================================ */
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
  color:#e7ecff;
  background:#05060c;
  touch-action:manipulation;
}

/* ===============================
   MATRIX BACKGROUND
================================ */
#matrixRain{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* ===============================
   CARD
================================ */
.card{
  position:relative;
  z-index:1;
  width:min(760px,96vw);
  height:96svh;
  margin:auto;
  padding:20px;
  border-radius:26px;
  border:1px solid rgba(34,211,238,.55);
  background:rgba(10,14,28,.78);
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  text-align:center;
}

.logo{
  font-family:Orbitron;
  color:#22d3ee;
  letter-spacing:.18em;
}
h1{
  font-family:Orbitron;
  margin:6px 0;
}
.muted{ opacity:.65; }

/* ===============================
   GAME CONTAINER
================================ */
.gameWrap{
  margin:12px 0;
  border-radius:16px;
  border:1px solid rgba(34,211,238,.55);
  overflow:hidden;
  background:#02030a;
  display:flex;
  flex-direction:column;
}

/* 🔑 FIXED HEIGHTS (NO FLEX BUGS) */
#game{
  width:100%;
  height:420px;
  display:block;
}

/* HUD */
.hud{
  height:44px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  font-family:Orbitron;
  font-size:13px;
  letter-spacing:.14em;
  background:linear-gradient(
    180deg,
    rgba(6,10,18,.98),
    rgba(4,8,16,1)
  );
  border-top:1px solid rgba(34,211,238,.55);
}

/* ===============================
   CONTROLS
================================ */
.controls,.actions{
  display:flex;
  gap:12px;
  margin-top:12px;
}

.joystick,.fire,.btn{
  flex:1;
  height:72px;
  border-radius:16px;
  border:1px solid rgba(34,211,238,.55);
  background:#020a14;
  color:#e7ecff;
  font-family:Orbitron;
  letter-spacing:.14em;
  display:flex;
  align-items:center;
  justify-content:center;
  text-transform:uppercase;
  text-decoration:none;
}
/* Normalize button text size across iOS */
button.btn{
  font-size:13px;          /* match MOVE / FIRE exactly */
  letter-spacing:.14em;
  appearance:none;
  -webkit-appearance:none;
}
.fire{ background:rgba(34,211,238,.18); }
</style>
</head>

<body>

<canvas id="matrixRain"></canvas>

<div class="card">
  <div class="logo">FILM MATRIX</div>
  <h1>Defense Simulation</h1>
  <div class="muted">Countermeasures engaged</div>

  <div class="gameWrap">
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="score">SCORE 00000</div>
      <div id="lives">LIVES 10</div>
      <div id="high">BEST 00000</div>
    </div>
  </div>

  <div class="controls">
    <div class="joystick" id="joy">MOVE</div>
    <div class="fire" id="fire">FIRE</div>
  </div>

  <div class="actions">
    <button class="btn" id="reset">RESET</button>
    <a class="btn" href="https://filmmatrix.net">EXIT</a>
  </div>
</div>

<script>
/* ===============================
   MATRIX RAIN
================================ */
const m = document.getElementById("matrixRain");
const mctx = m.getContext("2d");
function resizeMatrix(){
  m.width = innerWidth;
  m.height = innerHeight;
}
resizeMatrix(); addEventListener("resize", resizeMatrix);

const chars="アカサタナハマヤラ0123456789";
const fs=14;
let cols=Math.floor(innerWidth/fs);
let drops=Array(cols).fill(1);
setInterval(()=>{
  mctx.fillStyle="rgba(5,6,12,.18)";
  mctx.fillRect(0,0,m.width,m.height);
  mctx.font="600 "+fs+"px monospace";
  mctx.fillStyle="rgba(34,211,238,.75)";
  for(let i=0;i<drops.length;i++){
    mctx.fillText(chars[Math.random()*chars.length|0],i*fs,drops[i]*fs);
    if(drops[i]*fs>innerHeight&&Math.random()>0.97) drops[i]=0;
    drops[i]++;
  }
},50);

/* ===============================
   GAME LOGIC (CLIPPED)
================================ */
const c = document.getElementById("game");
const ctx = c.getContext("2d");

c.width = c.clientWidth;
c.height = c.clientHeight;

const PLAYFIELD = c.height - 20; // 🔑 hard clip line

let shipX = c.width/2;
let targetX = shipX;
let bullets=[];
let enemies=[];
let score=0;
let lives=10;
let high=Number(localStorage.getItem("fmHighScore")||0);

const posters=[
  "https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg",
  "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
  "https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg"
];

function spawn(){
  const img=new Image();
  img.src=posters[Math.random()*posters.length|0];
  enemies.push({x:Math.random()*(c.width-60),y:-90,w:60,h:90,img});
}
function shoot(){
  bullets.push({
    x: shipX,
    y: PLAYFIELD + 40,   // 🔑 well BELOW visible region
    w: 4.8,              // 🔑 +20% width (was 4)
    h: 10.8              // 🔑 +20% height (was 9)
  });
}

/* MOVE */
let lastX=0, active=false;
joy.ontouchstart=e=>{active=true;lastX=e.touches[0].clientX;e.preventDefault();}
joy.ontouchmove=e=>{
  if(!active)return;
  targetX+=(e.touches[0].clientX-lastX)*0.55;
  lastX=e.touches[0].clientX;
  e.preventDefault();
};
joy.ontouchend=()=>active=false;

/* FIRE */
fire.ontouchstart=e=>{shoot();e.preventDefault();};

/* RESET */
reset.onclick=()=>{
  bullets=[]; enemies=[];
  score=0; lives=10;
};

function loop(){
  ctx.clearRect(0,0,c.width,c.height);

  shipX+=(targetX-shipX)*0.16;
  shipX=Math.max(20,Math.min(c.width-20,shipX));

  /* BULLETS — HARD CLIPPED */
ctx.fillStyle="#7dd3fc";

bullets.forEach(b=>{
  if(b.y > PLAYFIELD){
    b.y -= 14;   // move but DO NOT draw yet
    return;
  }

  b.y -= 14;
  ctx.fillRect(
    b.x - b.w / 2,
    b.y,
    b.w,
    b.h
  );
});

  enemies.forEach((e,i)=>{
    e.y+=1.6;
    ctx.drawImage(e.img,e.x,e.y,e.w,e.h);
    bullets.forEach((b,j)=>{
      if(b.y<PLAYFIELD &&
         b.x>e.x&&b.x<e.x+e.w&&
         b.y>e.y&&b.y<e.y+e.h){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score+=10;
      }
    });
    if(e.y>c.height){
      enemies.splice(i,1);
      lives--;
    }
  });

  if(score>high){
    high=score;
    localStorage.setItem("fmHighScore",high);
  }

  scoreEl.textContent=`SCORE ${String(score).padStart(5,"0")}`;
  livesEl.textContent=`LIVES ${lives}`;
  highEl.textContent=`BEST ${String(high).padStart(5,"0")}`;

  if(Math.random()<0.03) spawn();
  if(lives>0) requestAnimationFrame(loop);
}
const scoreEl=score,livesEl=lives,highEl=high;
loop();
</script>

</body>
</html>
