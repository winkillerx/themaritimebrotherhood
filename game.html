<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film Matrix — Defense Simulation</title>

<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg0:#05060c;
  --bg1:#070a14;
  --bg2:#071425;
  --accent:#22d3ee;
  --accentBorder:rgba(34,211,238,.55);
  --muted:rgba(231,236,255,.65);
  --card:rgba(10,14,28,.78);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  height:100svh;               /* 🔑 fixes mobile Safari */
  display:grid;
  place-items:center;
  font-family:Inter,system-ui,sans-serif;
  color:#e7ecff;
  overflow:hidden;             /* no page scroll */

  background:
    radial-gradient(1200px 600px at 15% 10%, rgba(124,58,237,.18), transparent 55%),
    radial-gradient(900px 520px at 85% 20%, rgba(34,211,238,.18), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg0), var(--bg2));
}

#matrixRain{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

.card{
  position:relative;
  z-index:1;
  width:min(680px, 96vw);
  max-height:calc(100svh - 16px);   /* 🔑 fits screen */
  padding:24px 20px 20px;
  border-radius:24px;
  border:1px solid var(--accentBorder);
  background:var(--card);
  backdrop-filter: blur(14px);
  box-shadow:0 24px 70px rgba(0,0,0,.7);
  text-align:center;
  display:flex;
  flex-direction:column;
}

.logo{
  font-family:Orbitron;
  color:var(--accent);
  letter-spacing:.18em;
  margin-bottom:6px;
}

h1{
  font-family:Orbitron;
  font-size:26px;
  margin:0 0 6px;
}

.muted{ color:var(--muted); font-size:14px; }

.gameWrap{
  position:relative;
  margin:14px 0 12px;
  border-radius:16px;
  border:1px solid var(--accentBorder);
  overflow:hidden;
  background:#02030a;
  flex:1;                       /* 🔑 fills remaining space */
  display:flex;
  flex-direction:column;
}

#game{
  display:block;
  width:100%;
  flex:1;                       /* 🔑 adaptive height */
  touch-action:none;
}

.hud{
  display:flex;
  justify-content:space-between;
  padding:6px 12px;
  font-family:Orbitron;
  font-size:12px;
  letter-spacing:.1em;
  background:rgba(6,10,18,.9);
  border-top:1px solid var(--accentBorder);
}

.controls{
  display:flex;
  justify-content:space-between;
  padding:10px;
  gap:10px;
}

.joystick, .fire{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--accentBorder);
  background:rgba(6,10,18,.85);
  font-family:Orbitron;
  font-size:12px;
  letter-spacing:.12em;
}

.fire{
  background:rgba(34,211,238,.15);
}
</style>
</head>

<body>

<canvas id="matrixRain"></canvas>

<div class="card">
  <div class="logo">FILM MATRIX</div>
  <h1>Defense Simulation</h1>
  <div class="muted">Countermeasures active</div>

  <div class="gameWrap">
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="score">SCORE 00000</div>
      <div id="lives">LIVES 5</div>
    </div>
  </div>

  <div class="controls">
    <div class="joystick" id="joy">MOVE</div>
    <div class="fire" id="fire">FIRE</div>
  </div>
</div>

<script>
/* MATRIX BACKGROUND */
const mc=document.getElementById("matrixRain");
const mctx=mc.getContext("2d");
function resizeMatrix(){
  mc.width=innerWidth;
  mc.height=innerHeight;
}
resizeMatrix(); addEventListener("resize",resizeMatrix);

const chars="アカサタナハマヤラ0123456789";
const fontSize=14;
let cols=Math.floor(innerWidth/fontSize);
let drops=Array(cols).fill(1);
setInterval(()=>{
  mctx.fillStyle="rgba(5,6,12,.18)";
  mctx.fillRect(0,0,mc.width,mc.height);
  mctx.font="600 "+fontSize+"px monospace";
  mctx.fillStyle="rgba(34,211,238,.75)";
  for(let i=0;i<drops.length;i++){
    mctx.fillText(chars[Math.random()*chars.length|0],i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>innerHeight&&Math.random()>0.97) drops[i]=0;
    drops[i]++;
  }
},50);

/* GAME */
const g=document.getElementById("game");
const ctx=g.getContext("2d");
let w,h;
function resizeGame(){ w=g.width=g.clientWidth; h=g.height=g.clientHeight; }
resizeGame(); addEventListener("resize",resizeGame);

const ship={ x:w/2, y:h-26, w:50, h:10, targetX:w/2 };
let bullets=[], enemies=[];
let score=0, lives=5;

const posters=[
  "https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg",
  "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
  "https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg"
];

function spawn(){
  const img=new Image();
  img.src=posters[Math.random()*posters.length|0];
  enemies.push({ x:Math.random()*(w-70), y:-100, w:70, h:105, img });
}

function shoot(){ bullets.push({ x:ship.x, y:ship.y }); }

const joy=document.getElementById("joy");
let joyActive=false, joyX=0;

joy.addEventListener("touchstart",e=>{
  joyActive=true;
  joyX=e.touches[0].clientX;
},{passive:true});

joy.addEventListener("touchmove",e=>{
  if(!joyActive) return;
  const dx=e.touches[0].clientX-joyX;
  ship.targetX+=dx*0.6;
  joyX=e.touches[0].clientX;
},{passive:true});

joy.addEventListener("touchend",()=>joyActive=false);

document.getElementById("fire").addEventListener("touchstart",e=>{
  e.stopPropagation();
  shoot();
},{passive:true});

function loop(){
  ctx.clearRect(0,0,w,h);

  ship.x+=(ship.targetX-ship.x)*0.15;
  ship.x=Math.max(0,Math.min(w,ship.x));

  ctx.fillStyle="#22d3ee";
  ctx.fillRect(ship.x-ship.w/2,ship.y,ship.w,ship.h);

  bullets.forEach(b=>b.y-=12);
  ctx.fillStyle="#7dd3fc";
  bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,8));

  enemies.forEach((e,i)=>{
    e.y+=1.6;
    ctx.drawImage(e.img,e.x,e.y,e.w,e.h);
    bullets.forEach((b,j)=>{
      if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        enemies.splice(i,1); bullets.splice(j,1);
        score+=10;
      }
    });
    if(e.y>h){ enemies.splice(i,1); lives--; }
  });

  if(Math.random()<0.03) spawn();

  document.getElementById("score").textContent=`SCORE ${String(score).padStart(5,"0")}`;
  document.getElementById("lives").textContent=`LIVES ${lives}`;

  if(lives>0) requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
