<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film Matrix — Defense Simulation</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05060c">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ===============================
   HARDENING
================================ */
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
  background:#05060c;
  color:#e7ecff;
  touch-action:manipulation;
}

/* ===============================
   MATRIX BACKGROUND
================================ */
#matrixRain{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* ===============================
   CARD
================================ */
.card{
  position:relative;
  z-index:1;
  width:min(760px,96vw);
  height:90svh;
  margin:35px auto auto;
  padding:20px;
  border-radius:26px;
  border:1px solid rgba(34,211,238,.55);
  background:rgba(10,14,28,.78);
  backdrop-filter:blur(14px);
  display:flex;
  flex-direction:column;
  text-align:center;
}

.logo{
  font-family:Orbitron;
  color:#22d3ee;
  letter-spacing:.18em;
}
h1{
  font-family:Orbitron;
  margin:6px 0;
}

/* ===============================
   GAME CONTAINER
================================ */
.gameWrap{
  margin:12px 0;
  border-radius:16px;
  border:1px solid rgba(34,211,238,.55);
  overflow:hidden;
  background:#02030a;
  display:flex;
  flex-direction:column;
}

#game{
  width:100%;
  height:420px;
  display:block;
}

/* HUD */
.hud{
  height:44px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 16px;
  font-family:Orbitron;
  font-size:13px;
  letter-spacing:.14em;
  background:linear-gradient(180deg, rgba(6,10,18,.98), rgba(4,8,16,1));
  border-top:1px solid rgba(34,211,238,.55);
}

/* ===============================
   CONTROLS
================================ */
.controls,.actions{
  display:flex;
  gap:12px;
  margin-top:12px;
}

.joystick,.fire,.btn{
  flex:1;
  height:72px;
  border-radius:16px;
  border:1px solid rgba(34,211,238,.55);
  background:#020a14;
  color:#e7ecff;
  font-family:Orbitron;
  font-size:13px;
  letter-spacing:.14em;
  display:flex;
  align-items:center;
  justify-content:center;
  text-transform:uppercase;
  text-decoration:none;
}

/* FIX iOS BUTTON FONT */
button.btn{
  font-size:13px;
  letter-spacing:.14em;
  appearance:none;
  -webkit-appearance:none;
}

.fire{ background:rgba(34,211,238,.18); }
</style>
</head>

<body>

<canvas id="matrixRain"></canvas>

<div class="card">
  <div class="logo">FILM MATRIX</div>
  <h1>Defense Simulation</h1>

  <div class="gameWrap">
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="score">SCORE 00000</div>
      <div id="lives">LIVES 10</div>
      <div id="high">BEST 00000</div>
    </div>
  </div>

  <div class="controls">
    <div class="joystick" id="joy">MOVE</div>
    <div class="fire" id="fire">FIRE</div>
  </div>

  <div class="actions">
    <button class="btn" id="reset">RESET</button>
    <a class="btn" href="https://filmmatrix.net">EXIT</a>
  </div>
</div>

<script>
/* ===============================
   MATRIX RAIN
================================ */
const m = document.getElementById("matrixRain");
const mctx = m.getContext("2d");

function resizeMatrix(){
  m.width = innerWidth;
  m.height = innerHeight;
}
resizeMatrix();
addEventListener("resize", resizeMatrix);

const chars = "アカサタナハマヤラ0123456789";
const fs = 14;
let cols = Math.floor(innerWidth / fs);
let drops = Array(cols).fill(1);

setInterval(() => {
  mctx.fillStyle = "rgba(5,6,12,.18)";
  mctx.fillRect(0,0,m.width,m.height);
  mctx.font = "600 " + fs + "px monospace";
  mctx.fillStyle = "rgba(34,211,238,.75)";
  for (let i=0; i<drops.length; i++){
    mctx.fillText(chars[Math.random()*chars.length|0], i*fs, drops[i]*fs);
    if (drops[i]*fs > innerHeight && Math.random() > 0.97) drops[i] = 0;
    drops[i]++;
  }
}, 50);

/* ===============================
   GAME LOGIC
================================ */
const c = document.getElementById("game");
const ctx = c.getContext("2d");

function resizeGame(){
  c.width = c.clientWidth;
  c.height = c.clientHeight;
}
resizeGame();
addEventListener("resize", resizeGame);

let shipX = c.width/2;
let targetX = shipX;

let bullets = [];
let enemies = [];

let score = 0;
let lives = 10;
let high = Number(localStorage.getItem("fmHighScore") || 0);

let gameRunning = true;
let rafId = null;

/* Posters smaller */
const ENEMY_W = 45;
const ENEMY_H = 67.5;

const posters = [
  "https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg",
  "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
  "https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg"
];

function spawn(){
  const img = new Image();
  img.src = posters[Math.random()*posters.length|0];
  enemies.push({
    x: Math.random() * (c.width - ENEMY_W),
    y: -ENEMY_H,
    w: ENEMY_W,
    h: ENEMY_H,
    img
  });
}

/* Playfield baseline */
function playfieldY(){
  return c.height - 20;
}

/* Bullets 20% bigger */
function shoot(){
  bullets.push({
    x: shipX,
    y: playfieldY() - 12,
    w: 4.8,
    h: 10.8
  });
}

/* DOM refs */
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const highEl  = document.getElementById("high");
const joy     = document.getElementById("joy");
const fire    = document.getElementById("fire");
const reset   = document.getElementById("reset");

/* MOVE */
let lastX = 0, active = false;
joy.ontouchstart = e => { active = true; lastX = e.touches[0].clientX; e.preventDefault(); };
joy.ontouchmove  = e => {
  if(!active) return;
  targetX += (e.touches[0].clientX - lastX) * 0.55;
  lastX = e.touches[0].clientX;
  e.preventDefault();
};
joy.ontouchend = () => active = false;

/* FIRE */
fire.ontouchstart = e => { shoot(); e.preventDefault(); };

/* RESET (works even after death) */
reset.onclick = () => {
  bullets = [];
  enemies = [];
  score = 0;
  lives = 10;

  gameRunning = true;

  // prevent double loops
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
};

function loop(){
  ctx.clearRect(0,0,c.width,c.height);

  const PLAYFIELD = playfieldY();

  /* Ship smoothing */
  shipX += (targetX - shipX) * 0.14;
  shipX = Math.max(40, Math.min(c.width - 40, shipX));

  /* Shootbar 25% longer */
  const BAR_W = 85;
  const BAR_H = 6;
  const BAR_Y = PLAYFIELD - 10;

  ctx.fillStyle = "#22d3ee";
  ctx.shadowColor = "rgba(34,211,238,.6)";
  ctx.shadowBlur = 12;
  ctx.fillRect(shipX - BAR_W/2, BAR_Y, BAR_W, BAR_H);
  ctx.shadowBlur = 0;

  /* Bullets */
  ctx.fillStyle = "#7dd3fc";
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.y -= 14;
    ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);

    if (b.y < -30) bullets.splice(i,1);
  }

  /* Enemies */
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    e.y += 1.6;
    ctx.drawImage(e.img, e.x, e.y, e.w, e.h);

    // collisions
    for (let j = bullets.length - 1; j >= 0; j--){
      const b = bullets[j];
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score += 10;
        break;
      }
    }

    // missed enemy
    if (e.y > c.height){
      enemies.splice(i,1);
      lives--;
      if (lives <= 0){
        gameRunning = false;
      }
    }
  }

  if (score > high){
    high = score;
    localStorage.setItem("fmHighScore", high);
  }

  scoreEl.textContent = `SCORE ${String(score).padStart(5,"0")}`;
  livesEl.textContent = `LIVES ${lives}`;
  highEl.textContent  = `BEST ${String(high).padStart(5,"0")}`;

  if (gameRunning){
    if (Math.random() < 0.03) spawn();
    rafId = requestAnimationFrame(loop);
  } else {
    rafId = null;
  }
}

/* start */
rafId = requestAnimationFrame(loop);
</script>

</body>
</html>
